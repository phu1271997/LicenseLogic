<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161624"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A5B4FC"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shieldClip">
      <path d="M256 92 L386 140 V258 C386 332 331 386 256 414 C181 386 126 332 126 258 V140 Z"/>
    </clipPath>
  </defs>

  <!-- card background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- document with folded corner + text lines + big checkmark, all clipped by shield silhouette -->
  <g clip-path="url(#shieldClip)">
    <!-- document body -->
    <path d="M196 170
             H286
             L336 220
             V360
             H196
             Z"
          fill="none" stroke="url(#mark)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- folded corner -->
    <path d="M286 170 V220 H336"
          fill="none" stroke="url(#mark)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
    <!-- content lines (two short) -->
    <line x1="220" y1="252" x2="304" y2="252" stroke="url(#mark)" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
    <line x1="220" y1="284" x2="280" y2="284" stroke="url(#mark)" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
    <!-- big checkmark across the lower half — the "verified license" beat -->
    <path d="M212 322 L252 356 L326 288"
          fill="none" stroke="url(#mark)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- shield outline on top -->
  <path d="M256 92 L386 140 V258 C386 332 331 386 256 414 C181 386 126 332 126 258 V140 Z"
        fill="none" stroke="url(#mark)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
